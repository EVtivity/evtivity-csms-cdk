name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + lint + test + synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The tests synthesize every environment and run cdk-nag on each.
      - run: npm test

      # A full synth also bundles the Lambda functions, which the tests skip.
      - name: cdk synth
        env:
          CDK_DISABLE_VERSION_CHECK: '1'
        run: |
          for env in dev qa prod; do
            npx cdk synth --context env="$env" --quiet -o "cdk.out.$env"
          done

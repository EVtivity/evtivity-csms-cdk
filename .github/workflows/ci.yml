name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + lint + test + synth
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - name: cdk synth
        env:
          TARGET_ENV: ${{ matrix.env }}
          CDK_DISABLE_VERSION_CHECK: '1'
        run: npx cdk synth --context env="$TARGET_ENV" --quiet

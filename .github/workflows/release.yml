name: Release

# The CSMS release workflow bumps package.json (and config image tags) on
# every CSMS tag. Tag that commit and publish a GitHub release, the same way
# the Helm chart repo releases on a Chart.yaml bump.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

# Queue instead of cancel: cancelling after the tag push but before the
# release is created would leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check tag and release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.check.outputs.release == 'false'
        id: changelog
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # On a rerun where the tag already exists, stop the notes at the tag.
          END=HEAD
          if git rev-parse "$TAG" >/dev/null 2>&1; then END="$TAG"; fi
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | grep -v -- '-' | head -n1)
          BODY=$(./scripts/generate-changelog.sh "$PREV" "$END")
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Each part runs only if missing, so a rerun finishes a half-done release.
      - name: Create tag
        if: steps.check.outputs.tag == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        if: steps.check.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: gh release create "$TAG" --verify-tag --notes "$RELEASE_NOTES"

# EVtivity CSMS: dev environment.
# Smallest footprint for engineer testing. Spot capacity, fck-nat, Aurora
# that pauses when idle, a single Valkey node, no WAF. Everything is
# destroyed with the stacks. Account and hosted zone id go in dev.local.yaml.
env: dev
account: '111111111111'
region: us-east-1
image:
  registry: ghcr.io/evtivity/evtivity-csms
  tag: 0.1.43
domain:
  apex: evtivity.com
  subdomain: dev
  hostedZoneId: Z00000000000000000000
# First deploy of this environment. Tagged on every resource as CreatedDate.
createdDate: '2026-09-27'
tags:
  Project: evtivity-csms
  ManagedBy: cdk
  Repository: evtivity-csms-cdk
vpc:
  cidr: 10.10.0.0/16
  availabilityZones: [us-east-1a, us-east-1b]
  nat:
    mode: fck-nat
    count: 1
  interfaceEndpoints: []
logs:
  retentionDays: 14
  removal: destroy
ecs:
  containerInsights: enabled
  executeCommand: true
  redeployEveryDays: 7
aurora:
  engineVersion: '17.9'
  mode: serverless
  # 0 lets the cluster pause after autoPauseSeconds with no connections.
  # It only pauses when every service is scaled to 0.
  minCapacity: 0
  maxCapacity: 2
  autoPauseSeconds: 300
  readers: 0
  backupRetentionDays: 1
  deletionProtection: false
  removal: destroy
  performanceInsights: false
  monitoringIntervalSeconds: 60
  poolMax: 5
valkey:
  engineVersion: '8.2'
  nodeType: cache.t4g.micro
  replicas: 0
  snapshotRetentionDays: 1
rotation:
  enabled: true
  databaseDays: 30
  cacheDays: 30
secrets:
  removal: destroy
storage:
  versioned: true
  noncurrentVersionExpirationDays: 7
  logsExpirationDays: 14
  removal: destroy
alb:
  idleTimeoutSeconds: 120
  deletionProtection: false
  ocppPlainWs: false
waf:
  enabled: false
ocpi:
  countryCode: US
  partyId: EVT
  businessName: EVtivity
initialAdmin:
  email: admin@evtivity.com
appSettings: {}
# Demo sites, stations, drivers, and sessions. Runs once. Bump revision to
# rerun. Demo accounts use the password in evtivity/dev/demo-password.
seedDemo:
  enabled: false
  revision: 1
  stationLimit: 50
# Dashboard conformance runs start the OCSP responder in the worker, reached
# by the ocpp service (TC_C_50, TC_C_51, TC_C_52, TC_M_24).
octt:
  ocspResponder: true
monitoring:
  dashboard: true
  alarms: false
observability:
  enabled: true
  grafana:
    # grafana.<zone> accepts only these CIDRs. Empty keeps Grafana off the
    # internet until you add addresses with scripts/grafana-access.sh. Set
    # office or VPN ranges in config/<env>.local.yaml.
    allowedCidrs: []
    capacity: FARGATE_SPOT
  prometheus:
    capacity: FARGATE_SPOT
services:
  api:
    enabled: true
    cpu: 512
    memoryMiB: 1024
    capacity: FARGATE_SPOT
  ocpp:
    enabled: true
    cpu: 256
    memoryMiB: 512
    capacity: FARGATE_SPOT
    deregistrationDelaySeconds: 60
  ocpi:
    enabled: true
    cpu: 256
    memoryMiB: 512
    capacity: FARGATE_SPOT
  csms:
    enabled: true
    cpu: 256
    memoryMiB: 512
    capacity: FARGATE_SPOT
  portal:
    enabled: true
    cpu: 256
    memoryMiB: 512
    capacity: FARGATE_SPOT
  worker:
    enabled: true
    cpu: 256
    memoryMiB: 1024
    capacity: FARGATE_SPOT
  css:
    enabled: true
    cpu: 256
    memoryMiB: 512
    capacity: FARGATE_SPOT
  ocpiSim:
    enabled: false
  ocpiCpoSim:
    enabled: false

# EVtivity CSMS - dev environment
# Smallest infra for engineer testing.
env: dev
account: "111111111111" # replace with your dev AWS account id
region: us-east-1
domain:
  apex: evtivity.com
  subdomain: dev
  # Omit hostedZoneId to look up by apex (requires the zone to live in this account)
  # hostedZoneId: ZXXXXXXXXXXXXX
tags:
  Environment: dev
  Project: evtivity-csms
  ManagedBy: cdk
vpc:
  cidr: 10.10.0.0/16
  maxAzs: 2
  natCount: 1
aurora:
  minCapacity: 0.5
  maxCapacity: 1
  instanceCount: 1
  backupRetentionDays: 1
  deletionProtection: false
  iamAuthentication: true
  autoMinorVersionUpgrade: true
redis:
  nodeType: cache.t4g.micro
  replicas: 0
  multiAz: false
  automaticFailoverEnabled: false
  snapshotRetentionLimit: 0
s3:
  versioned: true
waf:
  rateLimit5min: 2000
  blockGeoMatch: []
alb:
  idleTimeoutSeconds: 60
  accessLogsRetentionDays: 7
  deletionProtection: false
services:
  api:
    imageRepo: ghcr.io/evtivity/evtivity-csms/api
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 3001
    healthCheckPath: /health
    public: true
    hostnamePrefix: api
    albPriority: 10
    env:
      NODE_ENV: production
      LOG_LEVEL: info
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/dev/database-url
      REDIS_URL: evtivity/dev/redis-url
      JWT_SECRET: evtivity/dev/jwt-secret
      SETTINGS_ENCRYPTION_KEY: evtivity/dev/settings-encryption-key
  ocpp:
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpp
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 8080
    healthCheckPath: /
    public: true
    hostnamePrefix: ocpp
    albPriority: 20
    env:
      NODE_ENV: production
      LOG_LEVEL: info
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/dev/database-url
      REDIS_URL: evtivity/dev/redis-url
      JWT_SECRET: evtivity/dev/jwt-secret
      SETTINGS_ENCRYPTION_KEY: evtivity/dev/settings-encryption-key
  ocpi:
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpi
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 3002
    healthCheckPath: /health
    public: true
    hostnamePrefix: ocpi
    albPriority: 30
    env:
      NODE_ENV: production
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/dev/database-url
      REDIS_URL: evtivity/dev/redis-url
  csms:
    imageRepo: ghcr.io/evtivity/evtivity-csms/csms
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 80
    healthCheckPath: /health
    public: true
    hostnamePrefix: csms
    albPriority: 40
  portal:
    imageRepo: ghcr.io/evtivity/evtivity-csms/portal
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 80
    healthCheckPath: /health
    public: true
    hostnamePrefix: portal
    albPriority: 50
  worker:
    imageRepo: ghcr.io/evtivity/evtivity-csms/worker
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      NODE_ENV: production
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/dev/database-url
      REDIS_URL: evtivity/dev/redis-url
  migrate:
    imageRepo: ghcr.io/evtivity/evtivity-csms/migrate
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 0
    minCount: 0
    maxCount: 1
    public: false
    isOneShot: true
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/dev/database-url
  css:
    enabled: true
    imageRepo: ghcr.io/evtivity/evtivity-csms/css
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      CSS_MODE: standby
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/dev/database-url
      REDIS_URL: evtivity/dev/redis-url
  ocpi-sim:
    enabled: false
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpi-simulator
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      NODE_ENV: production
      OCPI_SIM_ROLE: emsp
      OCPI_SIM_PORT: "3003"
  ocpi-cpo-sim:
    enabled: false
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpi-simulator
    imageTag: v0.1.12
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      NODE_ENV: production
      OCPI_SIM_ROLE: cpo
      OCPI_SIM_PORT: "3004"
      OCPI_SIM_AUTO_SESSION: "false"
      OCPI_SIM_SESSION_INTERVAL: "300"
      OCPI_SIM_SESSION_DURATION: "60"

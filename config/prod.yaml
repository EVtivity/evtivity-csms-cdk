# EVtivity CSMS: prod environment.
# Highly available: NAT gateway per AZ, Aurora writer plus reader across
# AZs, Valkey primary plus replica with automatic failover, two or more
# tasks per public service, WAF, deletion protection, and retained data.
# Account and hosted zone id go in prod.local.yaml.
env: prod
account: '111111111111'
region: us-east-1
image:
  registry: ghcr.io/evtivity/evtivity-csms
  tag: 0.1.41
domain:
  apex: evtivity.com
  subdomain: '' # csms.evtivity.com, api.evtivity.com, ...
  hostedZoneId: Z00000000000000000000
# First deploy of this environment. Tagged on every resource as CreatedDate.
createdDate: '2026-09-27'
tags:
  Project: evtivity-csms
  ManagedBy: cdk
  Repository: evtivity-csms-cdk
vpc:
  cidr: 10.30.0.0/16
  availabilityZones: [us-east-1a, us-east-1b]
  nat:
    mode: gateway
    count: 2
  interfaceEndpoints: []
logs:
  retentionDays: 365
  removal: retain
ecs:
  containerInsights: enabled
  executeCommand: false
  redeployEveryDays: 7
aurora:
  engineVersion: '17.9'
  mode: serverless
  minCapacity: 1
  maxCapacity: 16
  readers: 1
  backupRetentionDays: 14
  deletionProtection: true
  removal: snapshot
  performanceInsights: true
  monitoringIntervalSeconds: 60
  poolMax: 10
valkey:
  engineVersion: '8.2'
  nodeType: cache.t4g.medium
  replicas: 1
  snapshotRetentionDays: 7
rotation:
  enabled: true
  databaseDays: 30
  cacheDays: 30
secrets:
  removal: retain
storage:
  versioned: true
  noncurrentVersionExpirationDays: 90
  logsExpirationDays: 365
  removal: retain
alb:
  idleTimeoutSeconds: 120
  deletionProtection: true
  ocppPlainWs: false
waf:
  enabled: true
  rateLimitPer5Min: 2000
  # Per IP per 5 minutes. See docs/security.md#waf-rules.
  ocppRateLimitPer5Min: 20000
  authRateLimitPer5Min: 50
  guestRateLimitPer5Min: 100
  allowCountries: [US]
  logRetentionDays: 90
ocpi:
  countryCode: US
  partyId: EVT
  businessName: EVtivity
initialAdmin:
  email: admin@evtivity.com
appSettings: {}
monitoring:
  dashboard: true
  alarms: true
observability:
  enabled: true
  grafana:
    # grafana.<zone> accepts only these CIDRs. Empty keeps Grafana off the
    # internet until you add addresses with scripts/grafana-access.sh. Set
    # office or VPN ranges in config/<env>.local.yaml.
    allowedCidrs: []
services:
  api:
    enabled: true
    cpu: 1024
    memoryMiB: 2048
    desiredCount: 2
    autoscaling:
      min: 2
      max: 6
  ocpp:
    enabled: true
    cpu: 1024
    memoryMiB: 2048
    desiredCount: 2
    autoscaling:
      min: 2
      max: 6
      scaleInCooldownSeconds: 600
    # Stations reconnect to another task while this one drains.
    deregistrationDelaySeconds: 300
    stopTimeoutSeconds: 120
  ocpi:
    enabled: true
    desiredCount: 2
    autoscaling:
      min: 2
      max: 4
  csms:
    enabled: true
    desiredCount: 2
  portal:
    enabled: true
    desiredCount: 2
  worker:
    enabled: true
    cpu: 512
    memoryMiB: 1024
  css:
    enabled: false
  ocpiSim:
    enabled: false
  ocpiCpoSim:
    enabled: false

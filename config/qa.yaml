# EVtivity CSMS - qa environment
# Pre-prod verification, slightly larger than dev.
env: qa
account: "111111111111" # replace with your qa AWS account id (or same as dev/prod)
region: us-east-1
domain:
  apex: evtivity.com
  subdomain: qa
  # hostedZoneId: ZXXXXXXXXXXXXX
tags:
  Environment: qa
  Project: evtivity-csms
  ManagedBy: cdk
vpc:
  cidr: 10.20.0.0/16
  maxAzs: 2
  natCount: 1
aurora:
  minCapacity: 0.5
  maxCapacity: 2
  instanceCount: 1
  backupRetentionDays: 3
  deletionProtection: false
  iamAuthentication: true
  autoMinorVersionUpgrade: true
redis:
  nodeType: cache.t4g.small
  replicas: 0
  multiAz: false
  automaticFailoverEnabled: false
  snapshotRetentionLimit: 1
s3:
  versioned: true
waf:
  rateLimit5min: 2000
  blockGeoMatch: []
alb:
  idleTimeoutSeconds: 60
  accessLogsRetentionDays: 14
  deletionProtection: false
services:
  api:
    imageRepo: ghcr.io/evtivity/evtivity-csms/api
    imageTag: 0.1.17
    cpu: 512
    memoryMiB: 1024
    desiredCount: 1
    minCount: 1
    maxCount: 3
    containerPort: 3001
    healthCheckPath: /health
    public: true
    hostnamePrefix: api
    albPriority: 10
    env:
      NODE_ENV: production
      LOG_LEVEL: info
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/qa/database-url
      REDIS_URL: evtivity/qa/redis-url
      JWT_SECRET: evtivity/qa/jwt-secret
      SETTINGS_ENCRYPTION_KEY: evtivity/qa/settings-encryption-key
  ocpp:
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpp
    imageTag: 0.1.17
    cpu: 512
    memoryMiB: 1024
    desiredCount: 1
    minCount: 1
    maxCount: 3
    containerPort: 8080
    healthCheckPath: /
    public: true
    hostnamePrefix: ocpp
    albPriority: 20
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/qa/database-url
      REDIS_URL: evtivity/qa/redis-url
      JWT_SECRET: evtivity/qa/jwt-secret
      SETTINGS_ENCRYPTION_KEY: evtivity/qa/settings-encryption-key
  ocpi:
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpi
    imageTag: 0.1.17
    cpu: 512
    memoryMiB: 1024
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 3002
    healthCheckPath: /health
    public: true
    hostnamePrefix: ocpi
    albPriority: 30
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/qa/database-url
      REDIS_URL: evtivity/qa/redis-url
  csms:
    imageRepo: ghcr.io/evtivity/evtivity-csms/csms
    imageTag: 0.1.17
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 80
    healthCheckPath: /health
    public: true
    hostnamePrefix: csms
    albPriority: 40
  portal:
    imageRepo: ghcr.io/evtivity/evtivity-csms/portal
    imageTag: 0.1.17
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 2
    containerPort: 80
    healthCheckPath: /health
    public: true
    hostnamePrefix: portal
    albPriority: 50
  worker:
    imageRepo: ghcr.io/evtivity/evtivity-csms/worker
    imageTag: 0.1.17
    cpu: 512
    memoryMiB: 1024
    desiredCount: 1
    minCount: 1
    maxCount: 2
    public: false
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/qa/database-url
      REDIS_URL: evtivity/qa/redis-url
  migrate:
    imageRepo: ghcr.io/evtivity/evtivity-csms/migrate
    imageTag: 0.1.17
    cpu: 512
    memoryMiB: 1024
    desiredCount: 0
    minCount: 0
    maxCount: 1
    public: false
    isOneShot: true
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/qa/database-url
  css:
    enabled: true
    imageRepo: ghcr.io/evtivity/evtivity-csms/css
    imageTag: 0.1.17
    cpu: 512
    memoryMiB: 1024
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      CSS_MODE: standby
    secretsFromSecretsManager:
      DATABASE_URL: evtivity/qa/database-url
      REDIS_URL: evtivity/qa/redis-url
  ocpi-sim:
    enabled: false
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpi-simulator
    imageTag: 0.1.17
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      NODE_ENV: production
      OCPI_SIM_ROLE: emsp
      OCPI_SIM_PORT: "3003"
  ocpi-cpo-sim:
    enabled: false
    imageRepo: ghcr.io/evtivity/evtivity-csms/ocpi-simulator
    imageTag: 0.1.17
    cpu: 256
    memoryMiB: 512
    desiredCount: 1
    minCount: 1
    maxCount: 1
    public: false
    env:
      NODE_ENV: production
      OCPI_SIM_ROLE: cpo
      OCPI_SIM_PORT: "3004"
      OCPI_SIM_AUTO_SESSION: "false"
      OCPI_SIM_SESSION_INTERVAL: "300"
      OCPI_SIM_SESSION_DURATION: "60"
